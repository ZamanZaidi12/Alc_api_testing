# eth-api-console — nginx reverse proxy (native install)
#
# Puts nginx in front of the Node/Express backend (which listens on
# 127.0.0.1:3001 by default — see .env). Reasons to bother with this even
# for local testing:
#   - one clean URL/port instead of remembering :3001
#   - rate-limits /api/* so a stray retry loop or a "run request" double-click
#     doesn't burn through metered Alchemy/Etherscan credits
#   - gzip + basic security headers
#   - a real place to terminate TLS later if you ever expose this beyond
#     your own laptop
#
# This version is set up to be reachable by others on your local/office
# network (not just localhost) with NO login required — see the "allow"
# block below. That's a deliberate trade-off: nobody needs a password to use
# it, but it's still restricted to private IP ranges (RFC 1918), so it
# doesn't become reachable from the public internet even if this port ever
# gets forwarded on a router by accident. If you later need this open to
# people OUTSIDE your network, add real authentication first — don't just
# remove the allow/deny block.
#
# Install:
#   macOS (Homebrew):
#     cp nginx/eth-api-console.conf /opt/homebrew/etc/nginx/servers/
#     brew services restart nginx
#   Ubuntu/Debian:
#     sudo cp nginx/eth-api-console.conf /etc/nginx/sites-available/eth-api-console
#     sudo ln -s /etc/nginx/sites-available/eth-api-console /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# Then run the Node app as usual (npm start), open your host firewall for
# port 8080 (see README), and give teammates http://<your-lan-ip>:8080.

limit_req_zone $binary_remote_addr zone=eth_api_console_limit:10m rate=15r/s;

server {
    listen 8080;
    server_name localhost;

    # Private-network IP ranges only. Anyone outside these ranges gets a 403,
    # regardless of what the host firewall or router does — this is the
    # actual gate keeping this off the public internet.
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    gzip on;
    gzip_types application/json text/css application/javascript;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # Backend API routes — rate-limited so this console can't accidentally
    # blow through metered upstream API quotas, now shared across everyone
    # using it.
    location /api/ {
        limit_req zone=eth_api_console_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Frontend static console — no rate limit needed here.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

