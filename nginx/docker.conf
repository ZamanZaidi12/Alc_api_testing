# eth-api-console — nginx config for docker-compose.
# Same behavior as nginx/eth-api-console.conf, but proxy_pass targets the
# "app" service name (Docker's internal DNS) instead of 127.0.0.1, since
# nginx and the Node app run in separate containers here.
#
# Reachable by others on your local/office network, no login required, but
# restricted to private IP ranges (RFC 1918) — see the allow/deny block.
# Don't remove that block without adding real authentication first if this
# ever needs to be reachable from outside your network.

limit_req_zone $binary_remote_addr zone=eth_api_console_limit:10m rate=15r/s;

server {
    listen 80;
    server_name localhost;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    gzip on;
    gzip_types application/json text/css application/javascript;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    location /api/ {
        limit_req zone=eth_api_console_limit burst=30 nodelay;

        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
