# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Push this repo to GitHub, then on Render: New -> Blueprint -> select the
# repo. Render reads this file, builds the Dockerfile already in this repo,
# and gives you a public HTTPS URL. Render terminates TLS and proxies at its
# own edge, so nginx isn't part of this path — auth and rate limiting are
# handled in server.js instead (see CONSOLE_USERNAME/CONSOLE_PASSWORD below),
# which is why they're implemented at the app layer rather than in nginx.
#
# After the first deploy, go to the service's Environment tab and fill in
# the real values for every var marked sync: false below — Render prompts
# for these during setup and stores them as encrypted secrets. Never put
# real keys in this file.

services:
  - type: web
    name: eth-api-console
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: ETH_RPC_URL
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: CONSOLE_USERNAME
        sync: false
      - key: CONSOLE_PASSWORD
        sync: false
      - key: API_RATE_LIMIT_MAX
        value: "300"
