services:
  app:
    build: .
    container_name: eth-api-console-app
    env_file:
      - .env
    expose:
      - "3001"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: eth-api-console-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
